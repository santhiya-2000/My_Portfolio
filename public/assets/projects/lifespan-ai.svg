<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="240" fill="url(#bgGrad1)"/>
  
  <!-- Turbine/Engine visualization -->
  <g transform="translate(200, 120)">
    <!-- Center hub -->
    <circle cx="0" cy="0" r="20" fill="url(#engineGrad)"/>
    
    <!-- Turbine blades -->
    <g opacity="0.8">
      <path d="M 0 0 L 15 -40 Q 25 -35 20 -20 Z" fill="#60a5fa" transform="rotate(0)"/>
      <path d="M 0 0 L 15 -40 Q 25 -35 20 -20 Z" fill="#60a5fa" transform="rotate(120)"/>
      <path d="M 0 0 L 15 -40 Q 25 -35 20 -20 Z" fill="#60a5fa" transform="rotate(240)"/>
    </g>
    
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
    
    <!-- Inner detail -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Timeline/degradation indicator on bottom -->
  <g transform="translate(40, 200)">
    <rect width="320" height="2" fill="#93c5fd" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#60a5fa"/>
    <circle cx="160" cy="0" r="3" fill="#93c5fd" opacity="0.6"/>
    <circle cx="320" cy="0" r="4" fill="#60a5fa"/>
  </g>
  
  <!-- Labels -->
  <text x="200" y="25" font-family="Poppins" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1d23">LifeSpanAI</text>
  <text x="200" y="45" font-family="Poppins" font-size="11" text-anchor="middle" fill="#6b7280">RUL Prediction</text>
</svg>
